<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPS Format Baku</title>
<style>
@page{size:A4 landscape;margin:12mm 12mm 14mm;@bottom-right{content:counter(page);font:8pt Calibri,Carlito,Arial,sans-serif}}
@page :first{@bottom-right{content:""}}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#d9d9d9;color:#000;font:10pt/1.3 Calibri,Carlito,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:10px;background:#222;color:#fff}
.bar a{color:#fff}
.bar button{font:600 11pt Calibri,Carlito,Arial,sans-serif;padding:8px 18px;border:0;border-radius:6px;background:#fff;color:#000;cursor:pointer}
.page{width:297mm;min-height:210mm;margin:12px auto;padding:12mm;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25)}
h1,h2,h3{margin:0;text-align:center;font-size:12pt}
h3{margin:12px 0 6px}
p{margin:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #000;padding:3px 5px;vertical-align:top;overflow-wrap:break-word}
th{background:#e7e6e6;text-align:center;vertical-align:middle}
thead{display:table-header-group}
tr{break-inside:avoid}
.c{text-align:center}
.m{vertical-align:middle}
.b{font-weight:700}
.blue{background:#daeef3}
.grey{background:#e7e6e6;font-weight:700}
ol,ul{margin:0;padding-left:16px}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;height:186mm;min-height:0;font-size:12pt;font-weight:700}
.page.cover{height:210mm}
.cover img{width:34mm}
.cover h1{font-size:16pt;line-height:1.5}
.cover table{width:auto;table-layout:auto;font-weight:400}
.cover td{border:0;padding:1px 6px;text-align:left}
.desc p{margin-bottom:4px}
.desc h3.judul-tabel{margin-top:1.6em}
.desc th,.desc td{padding:2px 5px;line-height:1.22}
.desc .blok{break-inside:avoid}
.peta{--sela:4mm;font-size:9.5pt;line-height:1.25;text-align:center}
.peta .kotak{border:1px solid #000;padding:5px 6px}
.peta .kotak b,.peta .kotak i{display:block}
.peta .kotak i{font-size:8.5pt;margin-bottom:3px}
.peta .induk{min-height:24mm;display:flex;flex-direction:column;justify-content:center}
.peta .wadah{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--sela)}
.peta .cabang{display:flex;flex-direction:column}
.peta .arrow{font-size:8pt;line-height:14px}
/* garis penghubung antarcabang */
.peta .garis{height:0;margin:0 calc((100% - (var(--n) - 1) * var(--sela)) / (var(--n) * 2));border-top:1px solid #000}
.peta .tengah,.peta .batang{width:1px;min-height:12px;margin:0 auto;border-left:1px solid #000}
.peta .batang{flex:1}
.rps-a{font-size:9pt;line-height:1.22}
.rps-a th,.rps-a td{padding:2px 5px}
.rps-a .head img{width:21mm;display:block;margin:auto}
.rps-a .kop{font-size:14pt;line-height:1.35}
.rps-a .judul-rps{font-size:12.5pt;padding:4px 5px}
.sign{height:24mm;vertical-align:bottom;text-align:center}
.rps-a td.sambung-atas{border-top:0}
.rps-a td.sambung-bawah{border-bottom:0}
.hub{margin:3px 0}
.pendukung{margin-top:1.3em}
.identitas>*{vertical-align:middle}
.rps-b{font-size:8pt;line-height:1.16}
.rps-b th,.rps-b td{padding:2px 4px}
.rps-b ol,.rps-b ul{padding-left:12px}
.rps-b .sec{margin-bottom:2px}
.notes{break-before:page;font-size:9pt;line-height:1.22}
.notes ol{padding-left:24px}
.notes li{margin-bottom:1px}
.lampiran-rekap{font-size:10pt;line-height:1.3}
.rekap{break-inside:avoid;margin-bottom:18px}
.rekap h3{margin:0 0 6px}
.rekap th,.rekap td{padding:3px 5px}
.rekap table.jenis{width:60%;margin:auto}
.error{max-width:600px;margin:40px auto;padding:16px;background:#fff}
@media print{
  body{background:#fff}
  .bar{display:none}
  .page{width:auto;min-height:0;margin:0;padding:0 1px;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
  .page.cover{height:182mm}
}
</style>
</head>
<body>
<div class="bar">
  <button type="button" onclick="window.print()">Cetak / Simpan PDF</button>
  <span>Pilih tujuan “Simpan sebagai PDF”, ukuran A4. Disarankan memakai Chrome.</span>
  <a href="rps.html">Kembali ke RPS web</a>
</div>
<main id="doc"><p class="error">Data RPS belum termuat. Pastikan rps-data.js berada satu folder dengan halaman ini.</p></main>

<!-- Isi RPS ada di rps-data.js. Halaman ini mengatur tata letak cetak saja. -->
<script src="rps-data.js"></script>
<script>
(() => {
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const miring = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const ol = (arr, f = esc) => `<ol>${arr.map(x => `<li>${f(x)}</li>`).join("")}</ol>`;
const ul = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
const cols = (...w) => `<colgroup>${w.map(x => `<col style="width:${x}%">`).join("")}</colgroup>`;
const tgl = s => s ? D.mid(D.parse(s)) : "-";
const awalKapital = s => s.charAt(0).toUpperCase() + s.slice(1);

const METODE = { SGD: "small group discussion", CBL: "case-based learning", PjBL: "project-based learning", PBL: "problem-based learning" };
const subs = RPS.subcpmk;
const subsOf = k => subs.filter(s => s.cpmk === k);
const cplOf = c => [].concat(c.cpl).join(", ");
const jumlah = arr => arr.reduce((a, s) => a + s.bobot, 0);
const unik = arr => [...new Set(arr)];

/* Urutan dosen khusus cetak baku. Dosen yang tidak disebut mengikuti urutan di rps-data.js. */
const URUTAN_DOSEN = ["DKS", "FYP", "AWJ", "RHS"];
const peringkat = d => (URUTAN_DOSEN.indexOf(d.kode) + 1) || URUTAN_DOSEN.length + 1;
const dosenCetak = [...RPS.dosen].sort((a, b) => peringkat(a) - peringkat(b));

/* 1. Sampul */
function sampul() {
  return `<section class="page cover">
    <div><h1>RENCANA PEMBELAJARAN SEMESTER (RPS)<br>MATA KULIAH ${esc(M.namaMK.toUpperCase())}<br>(${esc(M.kode)})</h1></div>
    <img src="img/Logo-Unhas-200px.png" alt="Logo Universitas Hasanuddin">
    <table><tr><td></td><td class="b">Tim Pengajar</td></tr>${dosenCetak.map((d, i) => `<tr><td>${i + 1}.</td><td>${esc(d.nama)}</td></tr>`).join("")}</table>
    <div>${[M.prodi, M.fakultas, M.universitas, M.kota, M.tahunAkademik.split("/").pop()].map(x => esc(x.toUpperCase())).join("<br>")}</div>
  </section>`;
}

/* 2. Deskripsi */
function deskripsi() {
  const tabel = (judul, baris) => `<table>${cols(5, 14, 81)}<thead><tr><th>No.</th><th>${judul}</th><th>Deskripsi</th></tr></thead>
    <tbody>${baris.map(([k, t], i) => `<tr><td class="c">${i + 1}.</td><td>${esc(k)}</td><td>${esc(t)}</td></tr>`).join("")}</tbody></table>`;
  const capaian = arr => tabel("Kode", arr.map(x => [x.kode, x.teks]));
  return `<section class="page desc">
    <h2>${esc(M.prodi.toUpperCase())}<br>${esc(M.fakultas.toUpperCase())}</h2>
    <h3>Visi</h3><p class="c">“${esc(RPS.visi)}”</p>
    <h3>Misi</h3>${ol(RPS.misi)}
    <div class="blok"><h3 class="judul-tabel">Profil Lulusan</h3>${tabel("Profil Lulusan", RPS.profilLulusan.map(p => [p.nama, p.teks]))}</div>
    <div class="blok"><h3 class="judul-tabel">Capaian Pembelajaran Lulusan (CPL) Prodi yang Dibebankan pada MK</h3>${capaian(RPS.cpl)}</div>
    <div class="blok"><h3 class="judul-tabel">Capaian Pembelajaran Mata Kuliah (CPMK)</h3>${capaian(RPS.cpmk)}</div>
    <div class="blok"><h3 class="judul-tabel">Subcapaian Pembelajaran Mata Kuliah (Sub-CPMK)</h3>${capaian(subs)}</div>
  </section>`;
}

/* 3. Peta analisis pembelajaran: satu kolom untuk setiap CPMK, dibaca dari bawah ke atas */
/* Pekan berurutan ditulis sebagai rentang, misalnya "Pekan 3–5". */
function rentangPekan(kode) {
  const n = pertemuan.filter(p => p.sub === kode).map(p => p.pekan);
  if (!n.length) return "";
  const urut = n.every((x, i) => !i || x === n[i - 1] + 1);
  return `Pekan ${urut && n.length > 1 ? `${n[0]}–${n[n.length - 1]}` : n.join(", ")}`;
}
function peta() {
  const ringkas = t => awalKapital(t.replace(/^Mahasiswa mampu\s+/i, ""));
  const panah = '<div class="arrow">▲</div>';
  const cabang = RPS.cpmk.map(c => {
    const anak = [...subsOf(c.kode)].reverse().map(s =>
      `<div class="kotak"><b>${esc(s.kode)}</b><i>${rentangPekan(s.kode)}</i>${esc(ringkas(s.teks))}</div>`).join(panah);
    return `<div class="cabang">${panah}<div class="kotak blue induk"><b>${esc(c.kode)}</b>${esc(ringkas(c.teks))}</div>${panah}${anak}<div class="batang"></div></div>`;
  }).join("");
  return `<section class="page"><h2>Peta Analisis Pembelajaran</h2><br>
    <div class="peta" style="--n:${RPS.cpmk.length}">
      <div class="kotak b">LULUS MATA KULIAH ${esc(M.namaMK.toUpperCase())}</div><div class="tengah"></div><div class="garis"></div>
      <div class="wadah">${cabang}</div>
      <div class="garis"></div><div class="tengah"></div><div class="kotak b">Kompetensi awal</div>
    </div></section>`;
}

/* 4. RPS(a): identitas, capaian, hubungan CPL dan Sub-CPMK */
/* Teknik sumatif tanpa keterangan dalam kurung, misalnya "Tes tertulis". */
const teknikOf = s => s.teknik.replace(/\s*\(.*\)\s*$/, "");
const daftarTeknik = () => unik(subs.map(teknikOf));
/* Singkatan asesmen formatif. Bentuk lain ditulis lengkap. */
const FORMATIF = [
  { kode: "UB", pola: /^umpan balik/i, arti: "umpan balik" },
  { kode: "AD", pola: /^asesmen diri/i, arti: "asesmen diri" },
  { kode: "KI", pola: /^kuis interaktif/i, arti: "kuis interaktif di kelas" }
];
const singkat = f => FORMATIF.find(x => x.pola.test(f))?.kode || f;
const formatifOf = kode => unik(pertemuan.filter(p => p.sub === kode).flatMap(p => p.formatif.map(singkat)));

function matriks() {
  const teknik = daftarTeknik();
  let lalu = "";
  const baris = subs.map(s => {
    const c = cpmkByKode[s.cpmk], baru = s.cpmk !== lalu; lalu = s.cpmk;
    const n = subsOf(s.cpmk).length;
    return `<tr>${baru ? `<td rowspan="${n}">${esc(cplOf(c))}</td><td rowspan="${n}">${esc(c.kode)}</td>` : ""}
      <td>${esc(s.kode)}</td><td class="c">${esc(formatifOf(s.kode).join(", ") || "-")}</td>
      ${teknik.map(t => `<td class="c">${teknikOf(s) === t ? s.bobot + "%" : "-"}</td>`).join("")}<td class="c">${s.bobot}%</td></tr>`;
  }).join("");
  const dipakai = unik(subs.flatMap(s => formatifOf(s.kode)));
  const ket = FORMATIF.filter(f => dipakai.includes(f.kode)).map(f => `${f.kode} = ${f.arti}`).join("; ");
  const lebarTeknik = 32 / teknik.length;
  return `<table class="hub">${cols(11, 11, 14, 18, ...teknik.map(() => lebarTeknik), 14)}
    <thead><tr><th rowspan="3">CPL</th><th rowspan="3">CPMK</th><th rowspan="3">Sub-CPMK</th><th colspan="${teknik.length + 1}">Bentuk asesmen</th><th rowspan="3">Bobot penilaian</th></tr>
      <tr><th rowspan="2">Formatif</th><th colspan="${teknik.length}">Sumatif</th></tr>
      <tr>${teknik.map(t => `<th>${esc(t)}</th>`).join("")}</tr></thead>
    <tbody>${baris}
    <tr class="grey"><td colspan="3">Jumlah</td><td class="c">-</td>${teknik.map(t => `<td class="c">${jumlah(subs.filter(s => teknikOf(s) === t))}%</td>`).join("")}<td class="c">${jumlah(subs)}%</td></tr></tbody></table>
    <p>Keterangan: ${esc(ket)}.</p>`;
}

function rpsA() {
  const O = M.otorisasi;
  const judul = teks => `<td colspan="9" class="grey">${teks}</td>`;
  const isiBaris = (kode, teks, span = 1) => `${kode === null ? "" : `<td${span > 1 ? ` rowspan="${span}"` : ""}>${esc(kode)}</td>`}<td colspan="8">${teks}</td>`;
  const cp = [
    judul("CPL-Prodi yang dibebankan pada MK"),
    ...RPS.cpl.map(l => isiBaris(l.kode, esc(l.teks))),
    judul("CPL → Capaian Pembelajaran Mata Kuliah (CPMK)"),
    ...RPS.cpmk.map(c => isiBaris(cplOf(c), `<b>${esc(c.kode)}:</b> ${esc(c.teks)}`)),
    judul("CPMK → Sub-CPMK"),
    ...subs.map((s, i) => {
      const baru = !i || subs[i - 1].cpmk !== s.cpmk;
      return isiBaris(baru ? s.cpmk : null, `<b>${esc(s.kode)}:</b> ${esc(s.teks)}`, subsOf(s.cpmk).length);
    }),
    judul("Hubungan antara CPL dan CPMK/Sub-CPMK"),
    `<td colspan="9">${matriks()}</td>`
  ].map((sel, i, semua) => `<tr><td class="b ${i ? "sambung-atas" : ""} ${i < semua.length - 1 ? "sambung-bawah" : ""}">${i ? "" : "Capaian Pembelajaran (CP)"}</td>${sel}</tr>`).join("");
  const baris = (label, isi) => `<tr><td class="b">${label}</td><td colspan="9">${isi}</td></tr>`;
  return `<section class="page rps-a">
    <!-- Sepuluh kolom dasar agar lebar baris identitas dan baris otorisasi bisa diatur terpisah.
         Identitas: 14 | Kode 18 | Rumpun 24 | Bobot 9+9 | Semester 11 | Tanggal 15.
         Otorisasi: tiga kolom sama lebar (masing-masing 3 kolom dasar). -->
    <table>${cols(14, 9, 9, 10.667, 13.333, 9, 6.333, 2.667, 11, 15)}
    <tbody>
      <tr class="blue head"><td class="m"><img src="img/Logo-Unhas-200px.png" alt="Logo Universitas Hasanuddin"></td>
        <td colspan="8" class="c m b kop">${[M.universitas, M.fakultas, M.prodi].map(x => esc(x.toUpperCase())).join("<br>")}</td>
        <td class="c m"><b>Kode Dokumen</b><br>${esc(M.kodeDokumen || "")}</td></tr>
      <tr class="blue"><td colspan="10" class="c b judul-rps">RENCANA PEMBELAJARAN SEMESTER</td></tr>
      <tr class="grey identitas"><td>MATA KULIAH (MK)</td><th colspan="2">KODE</th><th colspan="2">RUMPUN MK</th><th colspan="3">BOBOT (sks)</th><th>SEMESTER</th><th>TGL PENYUSUNAN</th></tr>
      <tr class="identitas"><td class="b">${esc(M.namaMK)}</td><td colspan="2" class="c">${esc(M.kode)}</td><td colspan="2" class="c">${esc(M.rumpunMK || "-")}</td><td class="c">T = ${M.sksTeori}</td><td colspan="2" class="c">P = ${M.sksPraktik}</td><td class="c">${esc(M.semester)}</td>
        <td class="c">${esc(tgl(M.tanggalRevisi || M.tanggalPenyusunan))}</td></tr>
      <tr><td rowspan="2" class="b">OTORISASI / PENGESAHAN</td><th colspan="3">PENGEMBANG RPS</th><th colspan="3">KOORDINATOR MK</th><th colspan="3">KETUA PRODI</th></tr>
      <tr><td colspan="3" class="sign">${esc(O.pengembang)}</td><td colspan="3" class="sign">${esc(O.koordinator)}</td><td colspan="3" class="sign">${esc(O.ketuaProdi)}</td></tr>
      ${cp}
      ${baris("Deskripsi singkat mata kuliah", esc(RPS.deskripsi))}
      ${baris("Bahan kajian atau materi pembelajaran", ol(RPS.bahanKajian))}
      ${baris("Pustaka", `<b>Utama</b>${ol(RPS.pustaka.utama, miring)}<div class="pendukung"><b>Pendukung</b>${ol(RPS.pustaka.pendukung, miring)}</div>`)}
      ${baris("Dosen pengampu", ol(dosenCetak.map(d => d.nama)))}
      ${baris("Mata kuliah syarat", esc(M.prasyarat.join(", ") || "-"))}
    </tbody></table>
  </section>`;
}

/* 5. RPS(b): rencana per Sub-CPMK */
/* Satu nilai jika sama di semua pekan; jika berbeda, dirinci per pekan. */
function perPekan(ps, ambil) {
  const grup = new Map();
  ps.forEach(p => { const t = ambil(p); grup.set(t, [...(grup.get(t) || []), p.pekan]); });
  if (grup.size === 1) return esc([...grup.keys()][0]);
  return [...grup].map(([t, n]) => `${esc(t)} (pekan ${n.join(", ")})`).join("<br>");
}
function selLuring(ps, sub) {
  const sks = M.sksTeori + M.sksPraktik;
  /* "2 × 50 menit" di data menjadi "n pekan × sks × 50 menit". */
  const lama = jenis => unik(ps.map(p => {
    const teks = ({ ...RPS.bawaanPertemuan.waktu, ...(p.waktu || {}) })[jenis];
    return (teks.match(/(\d+)\s*menit/) || [])[1];
  })).map(menit => `[${ps.length} pekan × ${sks} sks × ${menit} menit]`).join("<br>");
  const metode = unik(ps.flatMap(p => p.metode || sub.metode || [])).map(m => METODE[m] || m);
  const tugas = RPS.penugasan.map((t, i) => ({ ...t, no: i + 1 })).filter(t => t.sub === sub.kode)
    .map(t => `Tugas ${t.no}: ${t.judul}. Luaran: ${t.luaran}`);
  const gabung = (kunci, bawaan) => unik(ps.flatMap(p => p[kunci] || bawaan));
  const bagian = (judul, jenis, isi) => `<div class="sec"><b>${judul}</b><br>${lama(jenis)}${ul(isi)}</div>`;
  return `<div class="sec"><b>Bentuk pembelajaran:</b> ${perPekan(ps, p => p.bentuk)}</div>
    ${bagian("Kegiatan belajar terbimbing", "terbimbing", [metode.join(", ")])}
    ${bagian("Kegiatan penugasan terstruktur", "terstruktur", gabung("terstruktur", tugas.length ? tugas : ["Membaca pustaka"]))}
    ${bagian("Kegiatan belajar mandiri", "mandiri", gabung("mandiri", ["Membaca pustaka"]))}`;
}
function rpsB() {
  const baris = subs.map(sub => {
    const ps = pertemuan.filter(p => p.sub === sub.kode);
    const materi = ps.map(p => `<div class="sec"><b>Pekan ${p.pekan}:</b>${ol(p.materi)}</div>`).join("");
    return `<tr><td class="c">${ps.map(p => p.pekan).join(", ")}</td>
      <td><b>${esc(sub.kode)}:</b> ${esc(sub.teks)}</td><td>${esc(sub.indikator)}</td>
      <td><div class="sec"><b>Teknik formatif:</b><br>${perPekan(ps, p => awalKapital(p.formatif.join(", ")))}</div><div class="sec"><b>Teknik sumatif:</b><br>${esc(sub.teknik)}</div><div class="sec"><b>Kriteria:</b><br>${perPekan(ps, p => p.kriteria)}</div></td>
      <td>${selLuring(ps, sub)}</td><td>${unik(ps.map(p => p.daring).filter(Boolean)).map(esc).join("<br>")}</td>
      <td>${materi}</td><td class="c">${sub.bobot}%</td></tr>`;
  }).join("");
  const catatan = [
    "Capaian Pembelajaran Lulusan Program Studi (CPL-Prodi) adalah kemampuan yang dimiliki oleh setiap lulusan program studi yang merupakan internalisasi dari sikap, pengetahuan, dan keterampilan sesuai dengan jenjang program studinya yang diperoleh melalui proses pembelajaran.",
    "CPL yang dibebankan pada mata kuliah adalah satu atau beberapa CPL-Prodi yang digunakan untuk pembentukan atau pengembangan sebuah mata kuliah dan penguasaannya dibebankan kepada suatu mata kuliah.",
    "Capaian Pembelajaran Mata Kuliah (CPMK) adalah kemampuan yang dijabarkan secara spesifik dari “CPL yang dibebankan pada mata kuliah” dan bersifat spesifik terhadap bahan kajian atau materi pembelajaran mata kuliah tersebut. CPMK diturunkan dari CPL.",
    "Subcapaian Pembelajaran Mata Kuliah (Sub-CPMK) adalah kemampuan yang dijabarkan secara spesifik dari CPMK yang dapat diukur dan merupakan kemampuan akhir yang direncanakan pada setiap tahap pembelajaran, serta bersifat spesifik terhadap materi pembelajaran mata kuliah tersebut. Sub-CPMK diturunkan dari CPMK.",
    "Penilaian formatif adalah proses evaluasi yang dilakukan secara berkelanjutan selama pembelajaran berlangsung dan bertujuan untuk memantau perkembangan belajar mahasiswa, memberikan umpan balik agar mahasiswa memenuhi capaian pembelajarannya, dan memperbaiki proses pembelajaran.",
    "Penilaian sumatif bertujuan untuk menilai pencapaian hasil belajar mahasiswa sebagai dasar penentuan kelulusan mata kuliah dan kelulusan program studi, dengan mengacu pada pemenuhan CPL. Penilaian sumatif dilakukan dalam bentuk ujian tertulis, ujian lisan, penilaian proyek, penilaian tugas, uji kompetensi, dan/atau bentuk penilaian lain yang sejenis.",
    "Indikator penilaian adalah pernyataan spesifik dan terukur yang digunakan untuk mengidentifikasi kemampuan atau kinerja hasil belajar mahasiswa yang disertai bukti-bukti.",
    "Kriteria penilaian adalah standar atau patokan yang digunakan untuk mengukur atau mengevaluasi ketercapaian tujuan pembelajaran berdasarkan indikator yang telah ditetapkan. Kriteria penilaian merupakan pedoman bagi penilai agar penilaian konsisten dan tidak bias. Kriteria dapat bersifat kuantitatif maupun kualitatif.",
    "Teknik penilaian terdiri atas partisipasi, observasi, unjuk kerja, tes tertulis, tes lisan, dan angket.",
    "Instrumen penilaian terdiri atas penilaian proses dalam bentuk rubrik dan/atau penilaian hasil dalam bentuk portofolio atau karya desain.",
    "Bentuk pembelajaran dapat berupa kuliah, responsi, tutorial, seminar, praktikum, praktik, studio, penelitian, perancangan, pengembangan, tugas akhir, pelatihan bela negara, pertukaran pelajar, magang, wirausaha, pengabdian kepada masyarakat, dan/atau bentuk pembelajaran lain. Bentuk pembelajaran tersebut dilakukan melalui kegiatan belajar terbimbing, kegiatan penugasan terstruktur, dan/atau kegiatan mandiri.",
    "Metode pembelajaran dapat berupa diskusi kelompok kecil (small group discussion; SGD), simulasi (roleplay simulation; RPS), pembelajaran berbasis kasus (case-based learning; CBL), pembelajaran kolaboratif (collaborative learning), pembelajaran kooperatif (cooperative learning; CoL), pembelajaran berbasis proyek (project-based learning; PjBL), pembelajaran berbasis masalah (problem-based learning; PBL), atau metode pembelajaran lain yang dapat secara efektif memfasilitasi pemenuhan capaian pembelajaran lulusan.",
    "Materi pembelajaran adalah rincian atau uraian dari bahan kajian yang dapat disajikan dalam bentuk beberapa pokok dan subpokok bahasan.",
    "Bobot penilaian adalah persentase penilaian terhadap setiap pencapaian Sub-CPMK yang besarnya proporsional dengan tingkat kesulitan pencapaian Sub-CPMK tersebut. Jumlah keseluruhan bobot penilaian adalah 100%."
  ];
  return `<section class="page rps-b">
    <table>${cols(5, 13, 15, 14, 22, 6, 20, 5)}
      <thead><tr><th rowspan="2">Per&shy;temuan ke-</th><th rowspan="2">Sub-CPMK<br>(Kemampuan akhir tiap tahapan belajar)</th><th colspan="2">Penilaian</th><th colspan="2">Bentuk Pembelajaran (BP) dan Metode Pembelajaran (MP)<br>[Estimasi waktu]</th><th rowspan="2">Materi Pembelajaran<br>[Pustaka]</th><th rowspan="2">Bobot</th></tr>
      <tr><th>Indikator</th><th>Teknik &amp; Kriteria</th><th>Luring</th><th>Daring</th></tr>
      <tr>${[1,2,3,4,5,6,7,8].map(n => `<th>(${n})</th>`).join("")}</tr></thead>
      <tbody>${baris}</tbody></table>
    <div class="notes"><b>Catatan</b>${ol(catatan)}</div>
  </section>`;
}

/* 6. Matriks CPL–CPMK dan rekap jenis asesmen */
/* Jenis asesmen = teknik sumatif + basisnya, misalnya "Tes tertulis berbasis kasus". */
const jenisOf = s => `${teknikOf(s)} ${(JENIS_ASESMEN[s.asesmen]?.pendek || s.asesmen).toLowerCase()}`;
const rekapJenis = arr => unik(arr.map(jenisOf)).map(j => [j, jumlah(arr.filter(s => jenisOf(s) === j))]);
function rekap() {
  const lebar = 86 / RPS.cpmk.length;
  const sel = (l, c) => {
    if (![].concat(c.cpl).includes(l.kode)) return "-";
    return rekapJenis(subsOf(c.kode)).map(([j, b], i) => `${esc(i ? j.charAt(0).toLowerCase() + j.slice(1) : j)} (${b}%)`).join(", ");
  };
  return `<section class="page lampiran-rekap"><div class="rekap"><h3>Matriks CPL, CPMK, dan bentuk asesmen</h3>
      <table>${cols(14, ...RPS.cpmk.map(() => lebar))}
        <thead><tr><th>CPL</th>${RPS.cpmk.map(c => `<th>${esc(c.kode)}</th>`).join("")}</tr></thead>
        <tbody>${RPS.cpl.map(l => `<tr><td class="c b">${esc(l.kode)}</td>${RPS.cpmk.map(c => `<td class="c">${sel(l, c)}</td>`).join("")}</tr>`).join("")}
        <tr class="grey"><td class="c">Jumlah</td>${RPS.cpmk.map(c => `<td class="c">${jumlah(subsOf(c.kode))}%</td>`).join("")}</tr></tbody></table></div>
    <div class="rekap"><h3>Jenis Asesmen dan Bobot Penilaian</h3>
      <table class="jenis">${cols(70, 30)}
        <thead><tr><th>Jenis asesmen</th><th>Bobot penilaian</th></tr></thead>
        <tbody>${rekapJenis(subs).map(([j, b]) => `<tr><td>${esc(j)}</td><td class="c">${b}%</td></tr>`).join("")}
        <tr class="grey"><td>Total</td><td class="c">${jumlah(subs)}%</td></tr></tbody></table></div></section>`;
}

document.title = `RPS ${M.namaMK} (${M.tahunAkademik.split("/").pop()}) - angkatan ${M.angkatan}`;
document.getElementById("doc").innerHTML = sampul() + deskripsi() + peta() + rpsA() + rpsB() + rekap();
})();
</script>
