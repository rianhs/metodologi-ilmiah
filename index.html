    <style>
        body { overflow-x: hidden; }

        @keyframes blob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }

        @media (prefers-reduced-motion: reduce) {

<body class="min-h-screen relative bg-[#0f172a] text-slate-100 font-sans antialiased selection:bg-accent-500/30">

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Komponen kecil */
const iconBox = (ikon, aktif) => `<div class="p-3 rounded-lg w-fit ${aktif
  ? "bg-accent-500/20 text-accent-400 group-hover:bg-accent-500 group-hover:text-white transition-colors"
  : "bg-slate-800 text-slate-500"}"><i data-lucide="${esc(ikon)}" class="w-6 h-6"></i></div>`;
const badge = (txt, aktif) => `<span class="${aktif ? "bg-accent-500/20 text-accent-300" : "bg-slate-800 text-slate-400"} text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wide">${esc(txt)}</span>`;
const segera = `<div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6 pt-4 border-t border-slate-800">Segera hadir</div>`;

/* Informasi umum */
function renderInfo() {
  $("deskripsi").textContent = MI.deskripsi;
  const I = MI.info;
  const rows = [
    ["Kode", I.kode], ["Bobot", I.bobot], ["Semester", I.semester],
    ["Sifat", I.sifat], ["Prasyarat", I.prasyarat], ["Koordinator", I.koordinator]
  ];
  $("facts").innerHTML = rows.map(([k, v]) => `
    <div class="glass rounded-2xl p-5">
      <dt class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">${esc(k)}</dt>
      <dd class="text-sm font-semibold text-slate-100 leading-snug">${esc(v)}</dd>
    </div>`).join("");
}

/* Dosen: kartu vertikal */
function renderDosen() {
  $("daftar-dosen").innerHTML = MI.dosen.map(d => `
    <article class="glass snap-start shrink-0 w-[220px] sm:w-[250px] rounded-2xl p-4 flex flex-col">
      <div class="relative aspect-[4/5] w-full rounded-xl overflow-hidden bg-accent-500/10 border border-accent-500/20 flex items-center justify-center text-accent-300 font-extrabold text-3xl tracking-wide mb-4">
        ${esc(d.kode)}
        ${d.foto ? `<img src="${esc(d.foto)}" alt="Foto ${esc(d.nama)}" loading="lazy" draggable="false" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : ""}
      </div>
      <div class="flex items-center gap-2 mb-1.5">
        <span class="text-[11px] font-bold tracking-wider text-slate-500">${esc(d.kode)}</span>
        ${d.peran ? `<span class="bg-accent-500/20 text-accent-300 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">${esc(d.peran)}</span>` : ""}
      </div>
      <h3 class="text-sm font-semibold text-slate-100 leading-snug">${esc(d.nama)}</h3>
    </article>`).join("");
}

/* Carousel: otomatis, tombol, roda tetikus, papan ketik, sentuh */
function setupCarousel() {
  const track = $("daftar-dosen");
  const behavior = reduceMotion ? "auto" : "smooth";
  const step = () => {
    const c = track.firstElementChild;
    const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    return c ? c.getBoundingClientRect().width + gap : track.clientWidth;
  };
  const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  const atStart = () => track.scrollLeft <= 4;
  const go = dir => {
    if (dir > 0 && atEnd()) track.scrollTo({ left: 0, behavior });
    else if (dir < 0 && atStart()) track.scrollTo({ left: track.scrollWidth, behavior });
    else track.scrollBy({ left: dir * step(), behavior });
  };

  let timer = null;
  const start = () => { if (reduceMotion || !MI.jedaCarousel || timer) return; timer = setInterval(() => go(1), MI.jedaCarousel); };
  const stop = () => { clearInterval(timer); timer = null; };
  const restart = () => { stop(); start(); };

  $("dosen-prev").addEventListener("click", () => { go(-1); restart(); });
  $("dosen-next").addEventListener("click", () => { go(1); restart(); });

  // Roda tetikus vertikal menggeser satu kartu; di ujung, halaman bergulir seperti biasa
  let wheelLock = false;
  track.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // geser horizontal trackpad dibiarkan
    const dir = Math.sign(e.deltaY);
    if (!dir || (dir > 0 && atEnd()) || (dir < 0 && atStart())) return;
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    track.scrollBy({ left: dir * step(), behavior });
    setTimeout(() => { wheelLock = false; }, 450);
  }, { passive: false });

  track.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  });

  // Berhenti saat dibaca, lanjut saat ditinggalkan
  const area = $("dosen");
  area.addEventListener("mouseenter", stop);
  area.addEventListener("mouseleave", start);
  area.addEventListener("focusin", stop);
  area.addEventListener("focusout", start);
  track.addEventListener("touchstart", stop, { passive: true });
  track.addEventListener("touchend", () => setTimeout(start, 4000), { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());

  start();
}

/* Rencana perkuliahan */
function kartuPerencanaan(d) {
  const aktif = !!d.href;
  const head = `<div class="flex justify-between items-start mb-4">${iconBox(d.ikon, aktif)}${badge(d.singkat, aktif)}</div>`;
  if (!aktif) return `<div class="glass rounded-2xl p-6 flex flex-col opacity-60">
      ${head}
      <h3 class="text-lg font-bold mb-2 text-slate-300 leading-snug">${esc(d.judul)}</h3>
      <p class="text-slate-500 text-sm flex-grow">${esc(d.deskripsi)}</p>
      ${segera}
    </div>`;
  return `<a href="${esc(d.href)}" class="card-link group glass rounded-2xl p-6 flex flex-col">
      ${head}
      <h3 class="text-lg font-bold mb-2 text-slate-100 leading-snug group-hover:text-accent-400 transition-colors">${esc(d.judul)}</h3>
      <p class="text-slate-400 text-sm flex-grow">${esc(d.deskripsi)}</p>
      <div class="flex items-center text-sm text-accent-400 font-bold mt-6 pt-4 border-t border-accent-500/30">
        ${esc(d.label)} <i data-lucide="arrow-right" class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform"></i>
      </div>
    </a>`;
}

/* Tugas dan penilaian */
function barisTautan(label, ikon, href) {
  if (!href) return `<div class="flex items-center justify-between gap-2 -mx-2 px-2 py-2 text-sm font-semibold text-slate-500">
      <span class="flex items-center gap-2"><i data-lucide="${ikon}" class="w-4 h-4"></i>${esc(label)}</span>
      <span class="text-[10px] uppercase tracking-wider">Segera hadir</span>
    </div>`;
  return `<a href="${esc(href)}" class="group/l flex items-center justify-between gap-2 -mx-2 px-2 py-2 rounded-lg text-sm font-semibold text-accent-400 hover:bg-accent-500/10 hover:text-accent-300 transition-colors">
      <span class="flex items-center gap-2"><i data-lucide="${ikon}" class="w-4 h-4"></i>${esc(label)}</span>
      <i data-lucide="arrow-right" class="w-4 h-4 shrink-0 group-hover/l:translate-x-1 transition-transform"></i>
    </a>`;
}

function kartuTugas(t) {
  return `<div class="glass rounded-2xl p-6 flex flex-col">
    <div class="flex justify-between items-start mb-4">${iconBox(t.ikon, true)}${badge("Tugas " + t.no, true)}</div>
    <h3 class="text-lg font-bold mb-2 text-slate-100 leading-snug">${esc(t.judul)}</h3>
    <div class="flex flex-wrap gap-x-5 gap-y-1 text-xs text-slate-400 mb-3">
      <span class="flex items-center gap-1.5"><i data-lucide="calendar-days" class="w-3.5 h-3.5 text-accent-400"></i>${esc(t.pekan)}</span>
      <span class="flex items-center gap-1.5"><i data-lucide="percent" class="w-3.5 h-3.5 text-accent-400"></i>Bobot ${esc(t.bobot)} nilai akhir</span>
    </div>
    <p class="text-slate-400 text-sm flex-grow">${esc(t.deskripsi)}</p>
    <div class="mt-6 pt-3 border-t border-accent-500/30 space-y-0.5">
      ${barisTautan("Rencana tugas mahasiswa", "clipboard-list", t.rtm)}
      ${barisTautan("Rubrik penilaian", "clipboard-check", t.rubrik)}
    </div>
  </div>`;
}

/* Bahan ajar */
function renderBahan() {
  const b = MI.bahanAjar, aktif = !!b.href;
  $("kartu-bahan").innerHTML = `
    <div class="glass rounded-2xl p-6 sm:p-8 flex flex-col md:flex-row gap-6 md:items-center ${aktif ? "" : "opacity-60"}">
      <div class="flex-grow">
        <div class="flex items-center gap-3 mb-3">
          <div class="p-2.5 rounded-lg ${aktif ? "bg-accent-500/15 text-accent-400" : "bg-slate-800 text-slate-500"}"><i data-lucide="book-open" class="w-5 h-5"></i></div>
          <h3 class="text-lg font-bold ${aktif ? "text-slate-100" : "text-slate-300"}">Bahan ajar per pekan</h3>
        </div>
        <p class="text-slate-400 text-sm leading-relaxed max-w-2xl">${esc(b.deskripsi)}</p>
      </div>
      <div class="shrink-0 w-full md:w-auto">
        ${aktif
          ? `<a href="${esc(b.href)}" class="flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-accent-500 hover:bg-accent-400 text-slate-900 text-sm font-bold transition-all shadow-lg shadow-accent-500/20">Buka bahan ajar <i data-lucide="arrow-right" class="w-4 h-4"></i></a>`
          : `<span class="flex items-center justify-center px-6 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-500 text-xs font-semibold uppercase tracking-wider">Segera hadir</span>`}
      </div>
    </div>`;
}

/* Mulai */
$("footer-teks").innerHTML = `&copy; ${esc(MI.tahun)} · Prodi Kedokteran Hewan, Fakultas Kedokteran, Universitas Hasanuddin · Dibuat oleh RianHS`;
renderInfo();
renderDosen();
$("daftar-perencanaan").innerHTML = MI.perencanaan.map(kartuPerencanaan).join("");
$("daftar-tugas").innerHTML = MI.tugas.map(kartuTugas).join("");
renderBahan();
lucide.createIcons();
setupCarousel();
})();
</script>
</body>
