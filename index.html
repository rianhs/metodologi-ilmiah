<style>
/* Warna mengikuti rps.html: terang = marun di atas kertas, gelap = emerald */
:root{
  --paper:#F7F6F2; --surface:#FFFFFF; --sunk:#F0EEE8;
  --ink:#1C1D1F; --ink-2:#45484D; --ink-3:#74777D;
  --rule:#E3E1DA; --rule-2:#CDCAC1;

}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1120; --surface:#172033; --sunk:#222D44;
  --ink:#F1F5F9; --ink-2:#CBD5E1; --ink-3:#94A3B8;
  --rule:#2A3650; --rule-2:#3A4866;
  --accent:#34d399; --tint:rgba(16,185,129,.16); --on-accent:#022c22;
  --shadow:rgba(16,185,129,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
p,dl,dd{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[data-theme="dark"] ::selection{background:rgba(16,185,129,.3)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:28px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}

/* Kepala */
.hero{padding-block:72px 8px;text-align:center}
.hero-icon{display:inline-flex;padding:14px;border-radius:50%;background:var(--tint);color:var(--accent);margin-bottom:20px}
.hero-icon svg{width:36px;height:36px}
.hero h1{font-size:clamp(2.4rem,6vw,3.75rem);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin-bottom:18px}
.hero p{color:var(--ink-2);max-width:640px;margin:0 auto;font-size:1.0625rem}

/* Bagian */
main{padding-block:56px 96px;display:flex;flex-direction:column;gap:80px}
.sec-head{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.eyebrow{font:600 .75rem/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sec-head h2{font-size:1.6rem;line-height:1.2}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:var(--sunk);color:var(--ink-2);font-size:.75rem;font-weight:600;white-space:nowrap}
.tag-accent{background:var(--tint);color:var(--accent)}
.code{font-weight:600;font-size:.8125rem;letter-spacing:.02em;color:var(--ink-3)}

/* Informasi umum */
.info{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.desc{padding:24px;color:var(--ink-2);font-size:.95rem;line-height:1.7}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.facts div{padding:16px 18px}
.facts dt{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.facts dd{font-weight:600;font-size:.95rem;line-height:1.4}

/* Dosen */

.wide p{color:var(--ink-2);font-size:.92rem;max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:var(--radius);font-size:.9rem;font-weight:600;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--on-accent);transition:filter .2s,box-shadow .2s}
.btn-primary:hover{filter:brightness(1.1)}
.btn-off{background:var(--sunk);border:1px solid var(--rule-2);color:var(--ink-3);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}

footer{border-top:1px solid var(--rule);padding:28px 0;text-align:center;font-size:.8125rem;color:var(--ink-3)}

.ctl:hover{color:var(--accent);border-color:var(--accent)}

.ic-sun{display:none}

/* Sentuhan mode gelap, sama dengan rps.html */

[data-theme="dark"] .person:hover{border-color:rgba(16,185,129,.45);box-shadow:0 8px 24px -12px rgba(16,185,129,.3)}
[data-theme="dark"] .ctl:hover,[data-theme="dark"] .btn-primary:hover{box-shadow:0 0 16px -4px rgba(52,211,153,.6)}

/* Cahaya latar (mode gelap) */
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
.bg-fx{display:none}
[data-theme="dark"] .bg-fx{display:block;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-fx span{position:absolute;width:24rem;height:24rem;border-radius:50%;filter:blur(64px);opacity:.12;animation:blob 12s ease-in-out infinite}

.bg-fx span:nth-child(2){top:6rem;right:2.5rem;background:#2563eb;animation-delay:-4s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

/* Responsif */

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Komponen kecil */
const icon = ikon => `<span class="icon"><i data-lucide="${esc(ikon)}"></i></span>`;
const tag = (txt, aktif) => `<span class="tag${aktif ? " tag-accent" : ""}">${esc(txt)}</span>`;

/* Informasi umum */
function renderInfo() {
  $("deskripsi").textContent = MI.deskripsi;
  const I = MI.info;
  $("facts").innerHTML = [
    ["Kode", I.kode], ["Bobot", I.bobot], ["Semester", I.semester],
    ["Sifat", I.sifat], ["Prasyarat", I.prasyarat], ["Koordinator", I.koordinator]
  ].map(([k, v]) => `<div class="box"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
}

/* Dosen: kartu vertikal. Jika foto gagal dimuat, kode dosen tampil sebagai pengganti. */
function renderDosen() {
  $("daftar-dosen").innerHTML = MI.dosen.map(d => `
    <article class="box person">
      <div class="photo">${esc(d.kode)}${d.foto ? `<img src="${esc(d.foto)}" alt="Foto ${esc(d.nama)}" loading="lazy" draggable="false" onerror="this.remove()">` : ""}</div>
      <div class="p-meta"><span class="code">${esc(d.kode)}</span>${d.peran ? tag(d.peran, true) : ""}</div>
      <h3 class="p-name">${esc(d.nama)}</h3>
    </article>`).join("");
}

/* Carousel: otomatis, tombol, roda tetikus, papan ketik, sentuh */
function setupCarousel() {
  const track = $("daftar-dosen");
  const behavior = reduceMotion ? "auto" : "smooth";
  const step = () => {
    const c = track.firstElementChild;
    const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    return c ? c.getBoundingClientRect().width + gap : track.clientWidth;
  };
  const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  const atStart = () => track.scrollLeft <= 4;
  const go = dir => {
    if (dir > 0 && atEnd()) track.scrollTo({ left: 0, behavior });
    else if (dir < 0 && atStart()) track.scrollTo({ left: track.scrollWidth, behavior });
    else track.scrollBy({ left: dir * step(), behavior });
  };

  let timer = null;
  const start = () => { if (reduceMotion || !MI.jedaCarousel || timer) return; timer = setInterval(() => go(1), MI.jedaCarousel); };
  const stop = () => { clearInterval(timer); timer = null; };
  const restart = () => { stop(); start(); };

  $("dosen-prev").addEventListener("click", () => { go(-1); restart(); });
  $("dosen-next").addEventListener("click", () => { go(1); restart(); });

  // Roda tetikus vertikal menggeser satu kartu; di ujung, halaman bergulir seperti biasa
  let wheelLock = false;
  track.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // geser horizontal trackpad dibiarkan
    const dir = Math.sign(e.deltaY);
    if (!dir || (dir > 0 && atEnd()) || (dir < 0 && atStart())) return;
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    track.scrollBy({ left: dir * step(), behavior });
    setTimeout(() => { wheelLock = false; }, 450);
  }, { passive: false });

  track.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  });

  // Berhenti saat dibaca, lanjut saat ditinggalkan
  const area = $("dosen");
  area.addEventListener("mouseenter", stop);
  area.addEventListener("mouseleave", start);
  area.addEventListener("focusin", stop);
  area.addEventListener("focusout", start);
  track.addEventListener("touchstart", stop, { passive: true });
  track.addEventListener("touchend", () => setTimeout(start, 4000), { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());

  start();
}

/* Rencana perkuliahan */
function kartuPerencanaan(d) {
  const aktif = !!d.href;
  const isi = `<div class="card-top">${icon(d.ikon)}${tag(d.singkat, aktif)}</div>
      <h3>${esc(d.judul)}</h3>
      <p>${esc(d.deskripsi)}</p>`;
  if (!aktif) return `<div class="box card is-off">${isi}<div class="card-foot soon">Segera hadir</div></div>`;
  return `<a href="${esc(d.href)}" class="box card card-link">${isi}
      <div class="card-foot go">${esc(d.label)} <i data-lucide="arrow-right"></i></div>
    </a>`;
}

/* Tugas dan penilaian */
function barisTautan(label, ikon, href) {
  const kiri = `<span><i data-lucide="${ikon}"></i>${esc(label)}</span>`;
  if (!href) return `<div class="link off">${kiri}<small>Segera hadir</small></div>`;
  return `<a href="${esc(href)}" class="link">${kiri}<i data-lucide="arrow-right"></i></a>`;
}

function kartuTugas(t) {
  return `<div class="box card">
    <div class="card-top">${icon(t.ikon)}${tag("Tugas " + t.no, true)}</div>
    <h3>${esc(t.judul)}</h3>
    <div class="meta">
      <span><i data-lucide="calendar-days"></i>${esc(t.pekan)}</span>
      <span><i data-lucide="percent"></i>Bobot ${esc(t.bobot)} nilai akhir</span>
    </div>
    <p>${esc(t.deskripsi)}</p>
    <div class="card-foot links">
      ${barisTautan("Rencana tugas mahasiswa", "clipboard-list", t.rtm)}
      ${barisTautan("Rubrik penilaian", "clipboard-check", t.rubrik)}
    </div>
  </div>`;
}

/* Bahan ajar */
function renderBahan() {
  const b = MI.bahanAjar, aktif = !!b.href;
  $("kartu-bahan").innerHTML = `
    <div class="box wide${aktif ? "" : " is-off"}">
      <div class="wide-text">
        <div class="wide-title">${icon("book-open")}<h3>Bahan ajar per pekan</h3></div>
        <p>${esc(b.deskripsi)}</p>
      </div>
      ${aktif
        ? `<a href="${esc(b.href)}" class="btn btn-primary">Buka bahan ajar <i data-lucide="arrow-right"></i></a>`
        : `<span class="btn btn-off">Segera hadir</span>`}
    </div>`;
}

/* Tema terang/gelap, disimpan dengan kunci yang sama dengan rps.html */
function setupTheme() {
  const btn = $("theme-toggle"), root = document.documentElement;
  const sync = () => {
    const label = root.dataset.theme === "dark" ? "Ganti ke mode terang" : "Ganti ke mode gelap";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  };
  btn.addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("mi-tema", root.dataset.theme); } catch (e) {}
    sync();
  });
  sync();
}

/* Mulai */
$("footer-teks").textContent = `© ${MI.tahun} · Prodi Kedokteran Hewan, Fakultas Kedokteran, Universitas Hasanuddin · Dibuat oleh RianHS`;
renderInfo();
renderDosen();
$("daftar-perencanaan").innerHTML = MI.perencanaan.map(kartuPerencanaan).join("");
$("daftar-tugas").innerHTML = MI.tugas.map(kartuTugas).join("");
renderBahan();
if (window.lucide) lucide.createIcons();
setupCarousel();
setupTheme();
})();
</script>
